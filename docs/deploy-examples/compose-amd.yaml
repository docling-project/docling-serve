# AMD ROCm deployment

services:
  docling-serve:
    # Published image: -rocm72:main (ROCm 7.2). Locally built options: -rocm:main (ROCm 6.3), -rocm101-gfx1151:main (ROCm 10.1.0 for AMD Strix Halo gfx1151)
    image: ghcr.io/docling-project/docling-serve-rocm72:main
    # image: ghcr.io/docling-project/docling-serve-rocm101-gfx1151:main
    container_name: docling-serve
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      ROCR_VISIBLE_DEVICES: "0" # https://rocm.docs.amd.com/en/latest/conceptual/gpu-isolation.html#rocr-visible-devices
      ## Recommended for unified APU memory architectures (e.g. Strix Halo gfx1151)
      # HSA_ENABLE_SDMA: "0"
      ## This section is for compatibility with older cards (do not set on native gfx1151)
      # HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      ## Enable experimental Flash/Mem-Efficient attention kernels on AMD GPU (aotriton) - comment out on gfx1151
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - 44    # video group GID from host
      - 992   # render group GID from host
    restart: always
