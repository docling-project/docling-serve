name: Run checks

on:
  workflow_call:

jobs:
  py-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          # pinned: uv 0.12.14 broke `uv lock` resolution for this project
          # https://github.com/astral-sh/uv/pull/21672
          version: "0.12.13"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: pre-commit cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --no-extra flash-attn

      - name: Run styling check
        run: uv run pre-commit run --all-files

  ui-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm --prefix ui ci
      - name: Typecheck and build
        run: npm --prefix ui run build

  build-package:
    uses: ./.github/workflows/job-build.yml

  test-package:
    needs:
      - build-package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          # pinned: uv 0.12.14 broke `uv lock` resolution for this project
          # https://github.com/astral-sh/uv/pull/21672
          version: "0.12.13"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install package
        run: uv pip install dist/*.whl
      - name: Create the server
        run: .venv/bin/python -c 'from docling_serve.app import create_app; create_app()'
      - name: Serve the web UI from the installed package
        run: |
          DOCLING_SERVE_ENABLE_UI=true .venv/bin/python -c '
          from fastapi.testclient import TestClient
          from docling_serve.app import create_app
          response = TestClient(create_app()).get("/ui/")
          assert response.status_code == 200 and "<div id=\"root\">" in response.text, response.text
          '

