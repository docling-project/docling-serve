name: Run checks

on:
  workflow_call:

jobs:
  py-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci
        with:
          python_version: ${{ matrix.python-version }}
          uv_sync_args: --frozen --all-extras --no-extra flash-attn

      - name: Set prek cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Cache prek environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/prek
          key: prek|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek|${{ env.PY }}|

      - name: Run styling and typing checks
        run: uv run --no-sync prek run --all-files --show-diff-on-failure

  ui-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm --prefix ui ci
      - name: Typecheck and build
        run: npm --prefix ui run build

  build-package:
    uses: ./.github/workflows/job-build.yml

  test-package:
    needs:
      - build-package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # pinned: uv 0.12.14 broke `uv lock` resolution for this project
          # https://github.com/astral-sh/uv/pull/21672
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install package
        run: uv pip install dist/*.whl
      - name: Create the server
        run: .venv/bin/python -c 'from docling_serve.app import create_app; create_app()'
      - name: Serve the web UI from the installed package
        run: |
          DOCLING_SERVE_ENABLE_UI=true .venv/bin/python -c '
          from fastapi.testclient import TestClient
          from docling_serve.app import create_app
          response = TestClient(create_app()).get("/ui/")
          assert response.status_code == 200 and "<div id=\"root\">" in response.text, response.text
          '

