name: Run checks

on:
  workflow_call:

jobs:
  build-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # pinned: uv 0.12.14 broke `uv lock` resolution for this project
          # https://github.com/astral-sh/uv/pull/21672
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
      - name: Install dependencies
        run: uv sync --all-extras --no-extra flash-attn
      - name: Build package
        run: uv build
      - name: Check content of wheel
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -q "docling_serve/ui_static/index.html"
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
